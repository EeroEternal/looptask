name = "looptask-api"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "looptask"
database_id = "fcaece73-31a3-4de1-a5db-2188356ac5da"

# Plain configuration — none of this is secret. Real secrets only:
#   wrangler secret put SESSION_SECRET LOOPTASK_EXECUTOR_SECRET GITHUB_CLIENT_SECRET CLOUDFLARE_API_TOKEN CELADON_API_KEY
[vars]
CLOUDFLARE_ACCOUNT_ID = "f073aa10866fbb6c4f213d62bee54acb"
# Verified sender address for Cloudflare Email Sending (PR confirmation mail):
LOOPTASK_EMAIL_FROM = "noreply@looptask.io"
# GitHub App OAuth (per-user GitHub connection; no shared PAT):
GITHUB_CLIENT_ID = "Iv23li1pJ22QMYRssaWx"
# GITHUB_CLIENT_SECRET goes to secrets, not here.
# Canonical public origin — GitHub OAuth redirect_uri must exactly match the
# URL registered on the GitHub App:
APP_ORIGIN = "https://looptask.io"
# Optional: push-model endpoint for your own executor. Unset (recommended) =
# runs queue in D1 and are claimed by executor/executor.mjs.
# LOOPTASK_EXECUTOR_URL = "https://your-sandbox.example/dispatch"
