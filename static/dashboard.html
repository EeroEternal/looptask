<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>looptask · Loop Control Center</title>
  <style>
    :root { color-scheme: dark; --bg:#09111f; --panel:#111d31; --line:#263956; --text:#e9f1ff; --muted:#91a4c2; --accent:#62e6c5; --blue:#78a9ff; --danger:#ff8c9e; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:radial-gradient(circle at 85% 0,#1d3957 0,transparent 35%),var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .shell { max-width:1240px; margin:auto; padding:34px 22px 60px } header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:34px; }
    .brand { display:flex; align-items:center; gap:13px } .mark { width:42px; height:42px; display:grid; place-items:center; border-radius:13px; color:#06221d; background:var(--accent); font-weight:900; box-shadow:0 0 30px #62e6c544; } h1,h2,p { margin:0 } h1 { font-size:25px; letter-spacing:-.03em } .eyebrow { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.16em; }
    .status { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:13px } .dot { width:9px;height:9px;border-radius:50%;background:#76849a } .dot.live { background:var(--accent); box-shadow:0 0 12px var(--accent) }
    .grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(340px,.9fr); gap:20px } .panel { background:#111d31dd; border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 18px 60px #0003; } .wide { grid-column:1/-1 }
    h2 { font-size:17px; margin-bottom:4px } .sub { color:var(--muted); margin-bottom:22px; font-size:13px } label { display:block; color:#b7c7df; font-size:12px; margin:15px 0 7px } input,select,textarea { width:100%; border:1px solid var(--line); border-radius:9px; padding:11px 12px; background:#0b1628; color:var(--text); outline:none; font:inherit } textarea { min-height:78px; resize:vertical } input:focus,select:focus,textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px #78a9ff1c }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:13px } .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px } button { border:0; border-radius:9px; padding:11px 16px; color:#061c1a; background:var(--accent); cursor:pointer; font-weight:700 } button.secondary { color:var(--text); background:#20304b; border:1px solid #344967 } button:disabled { cursor:wait; opacity:.55 }
    .repo { display:flex; gap:9px; align-items:center; padding:13px; border:1px solid #2e496e; background:#0d1b30; border-radius:11px; margin-bottom:17px } .repo-icon { color:var(--blue); font-size:22px } .repo strong { display:block } .repo span { color:var(--muted); font-size:12px; word-break:break-all }
    .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0 22px } .metric { background:#0d192c; border:1px solid var(--line); border-radius:11px; padding:14px } .metric b { display:block; font-size:26px; color:var(--accent) } .metric span { color:var(--muted); font-size:12px }
    .timeline { border-left:1px solid #38516f; margin:8px 0 0 7px; padding-left:19px } .event { position:relative; padding:0 0 19px } .event:before { content:""; position:absolute; width:8px;height:8px;border-radius:50%;background:var(--blue); left:-24px;top:7px } .event b { font-size:13px } .event small { display:block;color:var(--muted); margin-top:3px } .empty { color:var(--muted); padding:20px 0 }
    .banner { display:none; padding:11px 13px; border-radius:9px; margin-top:15px; background:#16324a; color:#bfe1ff; font-size:13px } .banner.show { display:block } .banner.error { background:#421e30; color:#ffb4c0 } code { color:var(--accent) }
    @media(max-width:800px) { .grid { grid-template-columns:1fr } .wide { grid-column:auto } header { align-items:flex-start; flex-direction:column } }
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><div class="mark">↻</div><div><div class="eyebrow">Loop Engineering</div><h1>looptask control center</h1></div></div><div class="status"><i class="dot" id="healthDot" aria-hidden="true"></i><span id="healthText">正在连接服务…</span></div></header>
    <div class="grid">
      <section class="panel">
        <h2>关联 GitHub 仓库</h2><p class="sub">配置项目来源，然后定义一个可重复执行的维护 loop。</p>
        <div class="repo"><div class="repo-icon">◈</div><div><strong id="repoName">尚未关联仓库</strong><span id="repoUrl">输入仓库地址后开始</span></div></div>
        <label for="repository">GitHub repository URL</label><input id="repository" placeholder="https://github.com/owner/repository" value="https://github.com/EeroEternal/looptask">
        <div class="row"><div><label for="project">项目名称</label><input id="project" value="looptask"></div><div><label for="branch">默认分支</label><input id="branch" value="main"></div></div>
        <label for="docs">文档路径 <span class="eyebrow">(逗号分隔)</span></label><input id="docs" value="README.md">
        <label for="source">源码路径 <span class="eyebrow">(逗号分隔)</span></label><input id="source" value="src,tests">
        <label for="stack">技术栈 <span class="eyebrow">(逗号分隔)</span></label><input id="stack" value="rust">
      </section>
      <section class="panel">
        <h2>制定 Loop Task</h2><p class="sub">选择目标、权限模式和运行策略。</p>
        <label for="loop">任务名称</label><input id="loop" value="docs-sync" placeholder="例如 docs-sync">
        <div class="row"><div><label for="kind">任务类型</label><select id="kind"><option value="docs_sync">Documentation sync</option><option value="external_data_sync">External data sync</option><option value="architecture_scan">Architecture scan</option></select></div><div><label for="mode">安全模式</label><select id="mode"><option value="report-only">report-only</option><option value="safe-pr" selected>safe-pr</option><option value="human-gated">human-gated</option></select></div></div>
        <label for="goal">目标描述</label><textarea id="goal">Keep project documentation aligned with source changes.</textarea>
        <div class="row"><div><label for="agent">Agent key</label><input id="agent" value="default"></div><div><label for="celld">celld URL</label><input id="celld" value="http://127.0.0.1:9876"></div></div>
        <div class="actions"><button id="plan">预览执行计划</button><button class="secondary" id="dispatch">立即派发任务</button></div><div class="banner" id="message"></div>
      </section>
      <section class="panel wide">
        <h2>过程监控</h2><p class="sub">实时查看 Agent cell 的 inbox、任务和 artifact 状态。</p>
        <div class="metrics"><div class="metric"><b id="inbox">—</b><span>Inbox events</span></div><div class="metric"><b id="tasks">—</b><span>Tasks</span></div><div class="metric"><b id="artifacts">—</b><span>Artifacts</span></div></div>
        <div class="timeline" id="timeline"><div class="empty">派发任务后，这里会显示运行事件。</div></div>
      </section>
    </div>
  </main>
  <script>
    const $=id=>document.getElementById(id), DEFAULTS={durableObjectClass:"AgentCell",artifactBucketPrefix:"agents",hotMessageLimit:50,maxSteps:12,maxConsecutiveFailures:3,largeFileLines:500}, say=(text,error=false)=>{const e=$("message");e.textContent=text;e.className="banner show"+(error?" error":"")};
    const list=id=>$(id).value.split(",").map(x=>x.trim()).filter(Boolean);
    function project(){return {name:$("project").value,repository:$("repository").value,defaultBranch:$("branch").value,techStack:list("stack"),docs:list("docs"),sourcePaths:list("source"),celld:{appDir:"celld",bucket:null,publicUrl:$("celld").value,internalUrl:null,durableObjectClass:DEFAULTS.durableObjectClass,artifactBucketPrefix:DEFAULTS.artifactBucketPrefix},loops:[{name:$("loop").value,kind:$("kind").value,goal:$("goal").value,mode:$("mode").value,trigger:{type:"manual"},agent:{cellIdTemplate:"{project}/{loop}/{agent}",sandboxRequired:false,allowedTools:["read-repo"],humanGate:$("mode").value==="human-gated"},verifiers:[],state:{hotSqliteScope:"agent-cell",artifactUriPrefix:"r2://agents/{agent}/artifacts/",hotMessageLimit:DEFAULTS.hotMessageLimit},stopRules:{maxSteps:DEFAULTS.maxSteps,maxConsecutiveFailures:DEFAULTS.maxConsecutiveFailures,largeFileLines:DEFAULTS.largeFileLines},escalationRules:[]}]};}
    function request(){return {project:project(),loopName:$("loop").value,agentKey:$("agent").value||"default"}}
    function card(title,detail){const e=document.createElement("div"),b=document.createElement("b"),s=document.createElement("small");e.className="event";b.textContent=title;s.textContent=detail;e.append(b,s);$("timeline").prepend(e)}
    async function call(path){const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(request())});if(!r.ok)throw Error(await r.text());return r.json()}
    async function plan(){ $("plan").disabled=true; try{const data=await call("/api/v1/loops/plan"); if(!data.accepted)throw Error(data.reason); $("repoName").textContent=project().name;$("repoUrl").textContent=project().repository;card("计划已生成",`Agent cell: ${data.loopPlan.agentCellId}`);say("计划已生成，可以确认后派发。")}catch(e){say(e.message,true)}finally{$("plan").disabled=false}}
    let monitorTimer, pollFailures=0;
    async function dispatch(){ $("dispatch").disabled=true; try{const data=await call("/api/v1/loops/dispatch"); if(!data.accepted)throw Error(data.reason); $("repoName").textContent=project().name;$("repoUrl").textContent=project().repository;card("任务已派发",`事件 ${data.dispatch.id} 已写入 ${data.loopPlan.agentCellId}`);say("任务已派发，正在监控 Agent cell。");clearInterval(monitorTimer);poll();monitorTimer=setInterval(poll,5000)}catch(e){say("派发失败："+e.message,true)}finally{$("dispatch").disabled=false}}
    async function poll(){try{const p=project(),id=`${p.name}/${$("loop").value}/${$("agent").value||"default"}`,r=await fetch("/api/v1/celld/agents/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({project:p,agentCellId:id})});if(!r.ok)throw Error("状态服务返回错误");const d=await r.json();pollFailures=0;$("inbox").textContent=d.inbox;$("tasks").textContent=d.tasks;$("artifacts").textContent=d.artifacts;$("healthDot").className="dot live";$("healthText").textContent="服务在线 · 状态已同步"}catch(_){pollFailures++;$("healthDot").className="dot";$("healthText").textContent="状态服务离线";if(pollFailures>=3)clearInterval(monitorTimer)}}
    $("repository").addEventListener("input",e=>{$("repoUrl").textContent=e.target.value;$("repoName").textContent=e.target.value.split("/").pop()||"尚未关联仓库"});$("plan").onclick=plan;$("dispatch").onclick=dispatch;fetch("/health").then(r=>{if(r.ok){$("healthDot").className="dot live";$("healthText").textContent="服务在线"}}).catch(()=>{$("healthText").textContent="服务不可用"});
  </script>
</body>
</html>
