[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "looptask"
version = "0.1.0"
description = "A lightweight Loop Engineering runner for AI-assisted development maintenance loops."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EeroEternal" }]
dependencies = []

[project.scripts]
looptask = "looptask.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

